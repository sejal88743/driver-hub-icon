services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vitratrack
      POSTGRES_PASSWORD: vitratrack_dev
      POSTGRES_DB: vitratrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitratrack -d vitratrack"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npx tsx server/migrate.ts"
    environment:
      DATABASE_URL: postgresql://vitratrack:vitratrack_dev@db:5432/vitratrack
    depends_on:
      db:
        condition: service_healthy

  app:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      DATABASE_URL: postgresql://vitratrack:vitratrack_dev@db:5432/vitratrack
      NODE_ENV: development
    ports:
      - "3000:3000"
    env_file:
      - /run/base44/app.env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  app_node_modules:
